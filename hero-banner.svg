<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0d"/>
      <stop offset="50%" stop-color="#0b1216"/>
      <stop offset="100%" stop-color="#06080a"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#162226" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="185" rx="14" fill="url(#bg)" stroke="#1e2d33" stroke-width="1.5"/>
  <rect width="1200" height="185" rx="14" fill="url(#grid)"/>

  <!-- Статус-бейдж -->
  <rect x="44" y="24" width="295" height="24" rx="12" fill="#0d1f1a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="60" cy="36" r="4" fill="#34d399"/>
  <text x="74" y="40" font-family="Segoe UI, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7" letter-spacing="1.4">VKV STUDIO • ENGINEERING HUB</text>

  <!-- Имя и фокус -->
  <text x="44" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="0.5">VALERII KARPOV</text>
  <text x="385" y="88" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="600" fill="#34d399" letter-spacing="0.3">// Applied LLM Systems &amp; High-Performance Web</text>

  <text x="44" y="118" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#94a3b8">
    Self-hosted Gemma 4 inference (QLoRA / Q8_0 GGUF), RAG grounding, ONNX runtimes, native CUDA tools &amp; verified sub-second web platforms.
  </text>

  <!-- Нижние плашки -->
  <g transform="translate(44, 136)" font-family="Consolas, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#0f161a" stroke="#26353d"/>
    <text x="80" y="18" fill="#6ee7b7" text-anchor="middle">Gemma 4 • QLoRA • RAG</text>

    <rect x="172" y="0" width="160" height="28" rx="6" fill="#0f161a" stroke="#26353d"/>
    <text x="252" y="18" fill="#e2e8f0" text-anchor="middle">Astro 6 • Svelte 5</text>

    <rect x="344" y="0" width="160" height="28" rx="6" fill="#0f161a" stroke="#26353d"/>
    <text x="424" y="18" fill="#e2e8f0" text-anchor="middle">FastAPI • Python 3.12</text>

    <rect x="516" y="0" width="175" height="28" rx="6" fill="#0f161a" stroke="#26353d"/>
    <text x="603" y="18" fill="#e2e8f0" text-anchor="middle">ONNX • Three.js • GSAP</text>

    <rect x="703" y="0" width="175" height="28" rx="6" fill="#0f161a" stroke="#26353d"/>
    <text x="790" y="18" fill="#38bdf8" text-anchor="middle">C# • Native CUDA Tools</text>
  </g>
</svg>